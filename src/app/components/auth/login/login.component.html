<div class="container">
    <div id="loginbox" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
      <div class="panel panel-info">
        <div class="panel-heading">
          <div class="panel-title">Connexion</div>
          <div style="float:right; font-size: 80%; position: relative; top:-10px">
            <a href="#">Récupérer votre mot de passe?</a>
          </div>
        </div>
        <div class="panel-body">
          <div *ngIf="registered" class="alert alert-success">
            Inscription réussie ! Vous pouvez maintenant vous connecter.
          </div>
          <div *ngIf="error" class="alert alert-danger">
            {{ error }}
          </div>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-horizontal">
            <div class="form-group">
              <label for="login" class="col-md-3 control-label">Login</label>
              <div class="col-md-9">
                <input type="text" class="form-control" formControlName="login" placeholder="Login ou email">
                <div *ngIf="submitted && f['login'].errors" class="text-danger">
                  <div *ngIf="f['login'].errors['required']">Login est requis</div>
                </div>
              </div>
            </div>
            
            <div class="form-group">
              <label for="password" class="col-md-3 control-label">Mot de passe</label>
              <div class="col-md-9">
                <input type="password" class="form-control" formControlName="password" placeholder="Mot de passe">
                <div *ngIf="submitted && f['password'].errors" class="text-danger">
                  <div *ngIf="f['password'].errors['required']">Mot de passe est requis</div>
                </div>
              </div>
            </div>
            
            <div class="form-group">
              <div class="col-md-offset-3 col-md-9">
                <button type="submit" class="btn btn-success">Se connecter</button>
                <p class="mt-3">Vous n'avez pas de compte? <a routerLink="/register">Inscrivez-vous ici</a></p>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
